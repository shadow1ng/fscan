name: poc-yaml-alibaba-nacos-namespace-unauth
sets:
  endpoint:
    - nacos/v1/console/namespaces
    - nacos/v3/console/core/namespace/list
rules:
  - method: GET
    path: /nacos/
    follow_redirects: true
    expression: |
      response.status == 200 && response.body.bcontains(b"<title>Nacos</title>")
  - method: GET
    path: /{{endpoint}}
    follow_redirects: false
    expression: |
      response.status == 200 && response.content_type.contains("json") && response.body.bcontains(b'"data"') && response.body.bcontains(b'"namespace"') && response.body.bcontains(b'"namespaceShowName"') && response.body.bcontains(b'"configCount"')
detail:
  author: CO0KlE1
  description: The Nacos console namespace list is accessible without authentication. The check is read-only and supports the v1 and v3 console APIs.
  links:
    - https://nacos.io/en/docs/latest/manual/admin/auth/
    - https://github.com/alibaba/nacos/blob/2.4.3/console/src/main/java/com/alibaba/nacos/console/controller/NamespaceController.java

