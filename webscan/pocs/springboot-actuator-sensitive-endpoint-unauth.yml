name: poc-yaml-springboot-actuator-sensitive-endpoint-unauth
rules:
  - method: GET
    path: /actuator
    follow_redirects: false
    search: |-
      "(?P<endpoint>beans|configprops|mappings|httpexchanges|httptrace|scheduledtasks|sessions|threaddump|logfile|jolokia|gateway|loggers)"\s*:\s*\{\s*"href"\s*:\s*"[^"]+"
    expression: |
      response.status == 200 && response.content_type.contains("json") && response.body.bcontains(b'"_links"')
  - method: HEAD
    path: /actuator/{{endpoint}}
    follow_redirects: false
    expression: |
      response.status == 200 && (response.content_type.contains("json") || response.content_type.contains("octet-stream") || response.content_type.contains("text/plain"))
detail:
  author: CO0KlE1
  description: A sensitive Spring Boot Actuator endpoint is listed and accessible without authentication. Detection uses one discovery request and a bodyless HEAD verification.
  links:
    - https://docs.spring.io/spring-boot/reference/actuator/endpoints.html
    - https://docs.spring.io/spring-boot/reference/actuator/monitoring.html
